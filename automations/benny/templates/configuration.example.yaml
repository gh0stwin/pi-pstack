schema_version: 1

# Benny runs as two headless pi jobs. See README.md and templates/*.yml.
runs:
  triage_name: "benny-triage"
  reproduce_name: "benny-reproduce"

# How reports reach Benny. `slack` needs the Slack section below; `github`
# reads issues from the configured repository through the tracker adapter and
# needs no Slack setup. `gitlab` reads issues from the configured GitLab
# project through the tracker adapter and also needs no Slack setup. `webhook`
# takes the whole binding from the event (`source_item`, `source_thread`,
# `verdict_location`, `adapter.read`, `adapter.post`) and needs no section
# either. A user who does not use Slack deletes the whole slack section and
# sets source to "github", "gitlab", or "webhook".
intake:
  source: "slack" # slack | github | gitlab | webhook

# Slack intake only. Delete this whole section for intake.source: github, gitlab, or webhook.
# Benny has no built-in Slack integration. Point `cli` at the wrapper the
# repository provides; it must implement the contract in
# skills/setup-benny/SKILL.md.
slack:
  cli: "benny-slack"
  source_channel_id: "SOURCE_CHANNEL_ID"
  operations_channel_id: ""
  triage_identity_user_id: "TRIAGE_IDENTITY_USER_ID"
  optional_bot_token_env: "BENNY_SLACK_BOT_TOKEN"
  allow_source_root_posts: false
  allow_worker_slack_writes: false

# GitLab intake only. Set `intake.source: "gitlab"` and point `tracker.adapter`
# at the GitLab client (`glab issue`). `project` is the project path and
# `token_env` names the environment variable that holds the token; never put
# the token value in this file. The run event names the issue and must agree
# with the project (`{"iid":42,"url":"https://gitlab.com/group/project/-/issues/42"}`).
# gitlab:
#   project: "group/project"
#   token_env: "GITLAB_TOKEN"

repository:
  url: "https://github.com/example-org/example-repo"
  default_branch: "main"
  forge: "gh"
  pull_request_url_format: "https://github.com/{owner}/{repo}/pull/{number}"
  draft_only: true

# The GitHub and GitLab intakes read the issue named by the run event
# (`{"issue":123,"url":"https://github.com/owner/repo/issues/123"}` or
# `{"iid":42,"url":"https://gitlab.com/group/project/-/issues/42"}`) and post
# the verdict as an issue comment through the tracker adapter below.
# `tracker.adapter` is required for those intakes: it reads the issue and posts
# the verdict comment.
#
# The webhook intake takes its binding from the event instead of the config:
# (`{"source_item":"SUP-1234","verdict_location":"SUP-1234#reply",
#    "adapter":{"read":"support-cli thread SUP-1234",
#               "post":"support-cli reply SUP-1234"}}`).
# `verdict_location` must name the same item as `source_item`.

tracker:
  type: "github-issues"
  adapter: "gh issue"
  team: ""
  project: ""
  labels:
    bug: "bug"
    performance: "performance"
    intake: "triage"
    needs_repro: "needs-repro"
  status: ""
  source_link_title: "Source report"
  require_compensation_action: true

routing:
  map_path: ".pi/benny/routing.md"
  owner_pings_default: false
  allow_feature_owner_ping: false
  allow_confirmed_regression_author_ping: false

# The verification skill drives the real app. Generate one with
# /skill:create-verification-skill and keep its feature map outside this pack.
verification:
  skill_name: "verify-target-app"
  feature_map_path: ".pi/benny/feature-map.md"
  environment: "safe-test-environment-placeholder"
  artifact_directory: "/tmp/benny-artifacts"
  artifact_retention_hours: 24

verdict_markers:
  bug: "[benny:bug]"
  performance: "[benny:performance]"
  other: "[benny:other]"
  tracker_attribute: "tracker"

status_emoji:
  seen: "👀"
  reproducing: "🔎"
  reproduced: "✅"
  could_not_reproduce: "⚪"
  blocked: "⛔"
  fixing: "🛠️"
  fix_failed: "❌"
  pull_request_opened: "🔗"

budgets:
  poll_seconds: 45
  verdict_wait_minutes: 45
  triage_follow_up_minutes: 10
  triage_total_minutes: 30
  repro_minutes: 60
  rejection_window_minutes: 10
  fix_minutes: 90
  operations_follow_up_minutes: 45

# pi model ids, from `pi --list-models`. `inherit-parent` and `auto` are valid
# and mean the job runs on the model pi resolves for that run.
models:
  triage: "inherit-parent"
  reproduce: "inherit-parent"
  code: "inherit-parent"
  media_review: "inherit-parent"
