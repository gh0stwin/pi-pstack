# Benny reproduce-and-fix for the GitHub intake. Copy to
# .github/workflows/benny-github-reproduce.yml in the target repository and
# adjust the guard label below and the pi install step.
#
# Use this pair instead of benny-triage.yml / benny-reproduce.yml when the
# configuration sets `intake.source: github`. No Slack CLI or token is needed.
#
# The reproduce label is `tracker.labels.needs_repro` in the configuration. The
# job-level `if:` guard below is the only place this workflow declares it, and
# a guard cannot read the configuration, so the literal MUST be changed to the
# configured label when it is not "needs-repro" (setup-benny step 10). A
# mismatch silently stops the labeled-event trigger. The schedule sweeps for
# the oldest triaged issue with no repro reply yet; a labeled issue or a manual
# dispatch runs one issue immediately.
#
# The sweep cadence (`cron`) and `timeout-minutes` are adjustable to the
# repository's traffic and repro budget; the shipped values are defaults, not
# limits (setup-benny step 10).
#
# Keep `draft_only: true` in the configuration. This workflow never merges.
name: benny-github-reproduce

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to reproduce
        required: true

concurrency:
  group: benny-reproduce
  cancel-in-progress: false

jobs:
  reproduce:
    # Must equal `tracker.labels.needs_repro` in .pi/benny/configuration.yaml.
    if: ${{ github.event_name != 'issues' || github.event.label.name == 'needs-repro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Install project packages
        run: pi install -l git:github.com/gh0stwin/pi-pstack

      - name: Reproduce and fix
        env:
          PI_PROVIDER_KEY: ${{ secrets.PI_PROVIDER_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENNY_INPUT_ISSUE: ${{ inputs.issue }}
          BENNY_EVENT_ISSUE: ${{ github.event.issue.number }}
          BENNY_EVENT_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            number="$BENNY_INPUT_ISSUE"
            case "$number" in
              '' | *[!0-9]*) echo "benny: the issue input must be a positive integer" >&2; exit 1 ;;
            esac
            url="https://github.com/$GITHUB_REPOSITORY/issues/$number"
            event=$(printf '{"issue":%s,"url":"%s"}' "$number" "$url")
          elif [ "$GITHUB_EVENT_NAME" = 'issues' ]; then
            event=$(printf '{"issue":%s,"url":"%s"}' "$BENNY_EVENT_ISSUE" "$BENNY_EVENT_URL")
          else
            # Scheduled sweep: let the skill pick the first triaged issue whose
            # trusted marker has no repro reply yet.
            event='{"sweep":true}'
          fi
          node .pi/automations/benny/runner/benny-run.ts \
            --mode reproduce \
            --config .pi/benny/configuration.yaml \
            --event "$event"
