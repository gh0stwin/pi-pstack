# Benny reproduce-and-fix for the GitLab intake. Copy to
# .github/workflows/benny-gitlab-reproduce.yml in the target repository and
# adjust the guard label and the pi install step.
#
# Use this pair instead of benny-triage.yml / benny-reproduce.yml when the
# configuration sets `intake.source: gitlab`. The reports are GitLab issues and
# the verdict is one comment on the issue through the GitLab tracker adapter.
# No Slack CLI or token is needed; the GitLab webhook relay is the same one
# benny-gitlab-triage.yml documents.
#
# The reproduce label is `tracker.labels.needs_repro` in the configuration.
# The job-level `if:` guard below is the only place this workflow declares it,
# and a guard cannot read the configuration, so the literal MUST be changed to
# the configured label when it is not "needs-repro" (setup-benny step 10). A
# mismatch silently stops the labeled-event trigger. The schedule sweeps for
# the oldest triaged issue with no repro reply yet; a labeled issue or a manual
# dispatch runs one issue immediately, and only when the event's newly added
# label is the reproduce label, so a later label change cannot re-trigger and
# duplicate the verdict.
#
# The tracker adapter reads the GitLab token from the environment variable
# named by `gitlab.token_env` in the configuration. The `GITLAB_TOKEN` env key
# in the run step below is the only place this workflow declares that name, so
# it MUST be changed to the configured name when it is not "GITLAB_TOKEN"
# (setup-benny step 10). A mismatch fails only when the adapter authenticates.
#
# Keep `draft_only: true` in the configuration. This workflow never merges.
name: benny-gitlab-reproduce

on:
  repository_dispatch:
    types: [benny-gitlab-report]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      iid:
        description: GitLab issue iid to reproduce
        required: true
      url:
        description: GitLab issue URL
        required: true

concurrency:
  group: benny-reproduce
  cancel-in-progress: false

jobs:
  reproduce:
    # Must equal `tracker.labels.needs_repro` in .pi/benny/configuration.yaml.
    if: ${{ github.event_name != 'repository_dispatch' || github.event.client_payload.label.name == 'needs-repro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Install project packages
        run: pi install -l git:github.com/gh0stwin/pi-pstack

      - name: Reproduce and fix
        env:
          PI_PROVIDER_KEY: ${{ secrets.PI_PROVIDER_KEY }}
          # Must equal `gitlab.token_env` in .pi/benny/configuration.yaml.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENNY_INPUT_IID: ${{ inputs.iid }}
          BENNY_INPUT_URL: ${{ inputs.url }}
          BENNY_EVENT_IID: ${{ github.event.client_payload.issue.iid }}
          BENNY_EVENT_URL: ${{ github.event.client_payload.issue.url }}
        run: |
          set -euo pipefail
          event=
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            iid="$BENNY_INPUT_IID"
            url="$BENNY_INPUT_URL"
          elif [ "$GITHUB_EVENT_NAME" = 'repository_dispatch' ]; then
            iid="$BENNY_EVENT_IID"
            url="$BENNY_EVENT_URL"
          else
            # Scheduled sweep: let the skill pick the first triaged issue whose
            # trusted marker has no repro reply yet.
            event='{"sweep":true}'
          fi
          if [ -z "$event" ]; then
            case "$iid" in
              '' | *[!0-9]*) echo "benny: the GitLab issue iid must be a positive integer" >&2; exit 1 ;;
            esac
            event=$(printf '{"iid":%s,"url":"%s"}' "$iid" "$url")
          fi
          node .pi/automations/benny/runner/benny-run.ts \
            --mode reproduce \
            --config .pi/benny/configuration.yaml \
            --event "$event"
