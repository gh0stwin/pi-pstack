# Benny triage for the GitLab intake. Copy to
# .github/workflows/benny-gitlab-triage.yml in the target repository and adjust
# the guard label and the pi install step.
#
# Use this pair instead of benny-triage.yml / benny-reproduce.yml when the
# configuration sets `intake.source: gitlab`. The reports are GitLab issues and
# the verdict is one comment on the issue through the GitLab tracker adapter.
# No Slack CLI or token is needed.
#
# GitLab issue webhooks cannot reach GitHub Actions directly, so a relay
# forwards each issue event as a `benny-gitlab-report` repository_dispatch with
# this normalized payload:
#
#   { "action": "opened" | "reopened" | "labeled",
#     "issue": { "iid": 42, "url": "https://gitlab.com/group/project/-/issues/42" },
#     "label": { "name": "triage" } }
#
# `label` is the newly added label and is present only for a labeled action.
# The intake label is `tracker.labels.intake` in the configuration. The
# job-level `if:` guard below is the only place this workflow declares it, and
# a guard cannot read the configuration, so the literal MUST be changed to the
# configured label when it is not "triage" (setup-benny step 10). A mismatch
# silently stops the labeled-event trigger. A new or reopened issue is triaged
# as it arrives; a labeled issue is triaged only when the event's newly added
# label is the intake label, so a later label change cannot re-trigger and
# duplicate the verdict.
#
# The tracker adapter reads the GitLab token from the environment variable
# named by `gitlab.token_env` in the configuration. The `GITLAB_TOKEN` env key
# in the run step below is the only place this workflow declares that name, so
# it MUST be changed to the configured name when it is not "GITLAB_TOKEN"
# (setup-benny step 10). A mismatch fails only when the adapter authenticates.
#
# `timeout-minutes` is adjustable to the repository's triage budget; the shipped
# value is a default, not a limit (setup-benny step 10).
name: benny-gitlab-triage

on:
  repository_dispatch:
    types: [benny-gitlab-report]
  workflow_dispatch:
    inputs:
      iid:
        description: GitLab issue iid to triage
        required: true
      url:
        description: GitLab issue URL
        required: true

concurrency:
  group: benny-triage-${{ github.event.client_payload.issue.iid || inputs.iid }}
  cancel-in-progress: false

jobs:
  triage:
    # Must equal `tracker.labels.intake` in .pi/benny/configuration.yaml.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.client_payload.action == 'opened' || github.event.client_payload.action == 'reopened' || github.event.client_payload.label.name == 'triage' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Install project packages
        run: pi install -l git:github.com/gh0stwin/pi-pstack

      - name: Triage the issue
        env:
          PI_PROVIDER_KEY: ${{ secrets.PI_PROVIDER_KEY }}
          # Must equal `gitlab.token_env` in .pi/benny/configuration.yaml.
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          BENNY_INPUT_IID: ${{ inputs.iid }}
          BENNY_INPUT_URL: ${{ inputs.url }}
          BENNY_EVENT_IID: ${{ github.event.client_payload.issue.iid }}
          BENNY_EVENT_URL: ${{ github.event.client_payload.issue.url }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            iid="$BENNY_INPUT_IID"
            url="$BENNY_INPUT_URL"
          else
            iid="$BENNY_EVENT_IID"
            url="$BENNY_EVENT_URL"
          fi
          case "$iid" in
            '' | *[!0-9]*) echo "benny: the GitLab issue iid must be a positive integer" >&2; exit 1 ;;
          esac
          event=$(printf '{"iid":%s,"url":"%s"}' "$iid" "$url")
          node .pi/automations/benny/runner/benny-run.ts \
            --mode triage \
            --config .pi/benny/configuration.yaml \
            --event "$event"
